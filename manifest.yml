modules:
  jira:issuePanel:
    - key: sentinelforge-panel
      title: SentinelForge Context & Sentinel
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      render: native
      resource: main
      resolver:
        function: resolver
  rovo:agent:
    - key: sentinelforge-rovo-agent
      name: SentinelForge Agent
      description: Context-aware security and operations agent powered by Teamwork Graph and Model Context Protocol.
      prompt: >
        You are SentinelForge, an autonomous security and orchestration agent.
        Analyze Jira tickets, Confluence pages, and Teamwork Graph relations to detect configuration drift, suggest automated remediations, and generate Confluence retrospectives.
      conversationStarters:
        - "Audit recent changes on this project"
        - "Check compliance policies across Jira and Confluence"
        - "Remediate configuration drift for current issue"
        - "Generate Confluence retrospective for this incident"
      actions:
        - audit-drift-action
        - remediate-incident-action
        - generate-postmortem-action
  action:
    - key: audit-drift-action
      function: agentActionHandler
      actionVerb: GET
      title: Audit Project Drift & Graph Relations
      description: Queries Teamwork Graph to detect drift between Jira issues, Confluence specs, and commits.
    - key: remediate-incident-action
      function: agentActionHandler
      actionVerb: POST
      title: Remediate Incident Drift
      description: Executes automated remediation steps and posts mitigation reports back to Jira.
    - key: generate-postmortem-action
      function: agentActionHandler
      actionVerb: POST
      title: Generate Confluence Retrospective Page
      description: Publishes an automated incident retrospective page into Confluence with root cause and ADR sync.
  function:
    - key: resolver
      handler: index.handler
    - key: agentActionHandler
      handler: agent.actionHandler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  id: ari:cloud:ecosystem::app/7b8c2a1e-4592-4f11-9a7c-3e6f982a1d01
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.all
    - write:confluence-content
    - read:graph:jira
    - read:me
